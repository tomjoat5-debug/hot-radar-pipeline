name: Daily refresh

# Runs the pipeline once a day and commits the updated report back,
# so the repository stays alive with a fresh reports/latest.md.
# The SQLite database is cached between runs so the "new topics today"
# section can diff against the previous snapshot; if the cache is gone,
# the run degrades to a full fresh run (first-run report) and continues.

on:
  schedule:
    - cron: "0 1 * * *"  # 09:00 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore previous database
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-
      - name: Run pipeline
        run: python -m radar_pipeline.run
      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md
          git diff --cached --quiet || git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
          git push